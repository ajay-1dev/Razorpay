spring:
  application:
    name: razorpay
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
logging:
  level:
    com:
      ajay:
        developer:
          razorpay: trace
#  pattern:
#   console: == [%level] == %d{yyyy-MM-dd HH:mm:ss} [%c] -----> %m/%n
