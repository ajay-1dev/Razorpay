spring:
  application:
    name: razorpay
  datasource:
    url: jdbc:postgresql://localhost:5432/razorpay-db
    username: ajay
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  kafka:
    listener:
      ack-mode: manual
    bootstrap-servers: localhost:29092
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        retries: 3
        spring.json.add.type.headers: false
    consumer:
      group-id: razorpay-monolith
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.ajay.developer.razorpay.*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: java.util.LinkedHashMap


#  security:
#    user:
#      name: admin
#      password: admin123
logging:
  level:
    com:
      ajay:
        developer:
          razorpay: trace
#  pattern:
#   console: == [%level] == %d{yyyy-MM-dd HH:mm:ss} [%c] -----> %m/%n

payment:
  simulator:
    poll-interval-ms: 5000
    chaos-mode: NORMAL
    methods:
      CARD:
        min-delay-seconds: 2
        max-delay-seconds: 6
        sucess-rate: 90
      UPI:
        min-delay-seconds: 1
        max-delay-seconds: 3
        sucess-rate: 95
      NET_BANKING:
        min-delay-seconds: 4
        max-delay-seconds: 10
        sucess-rate: 80

management:
  endpoints:
    web:
      exposure:
        include: "*"

app:
  rate-limit:
    method: bucket
    use-case:
      api-key:
        api-per-minute: 200
  kafka:
    topics:
      payment: payments.events
      order: order.events
      refund: refund.events
      settlement: settlement.events
  webhook:
    delivery:
      redis-key: "webhook-retry"
      poll-batch-size: 100
